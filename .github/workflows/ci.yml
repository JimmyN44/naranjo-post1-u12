name: CI - Build, Test & Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pedidos
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

   
      - name: Configurar JDK 17 con cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: pedidos/pom.xml

      - name: Compilar y ejecutar pruebas
        run: mvn -B -ntp clean verify

      - name: Publicar reporte de pruebas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: pedidos/target/surefire-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    env:
      IMAGE: mi-spring-app:${{ github.sha }}
      CONTAINER: smoke-test
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t "$IMAGE" .

      - name: Levantar el contenedor y esperar /actuator/health
        run: |
          docker run -d --name "$CONTAINER" -p 8080:8080 "$IMAGE"

          for i in $(seq 1 15); do
            if curl -sf --max-time 3 http://localhost:8080/actuator/health | jq -e '.status == "UP"' > /dev/null; then
              echo "La aplicacion respondio UP (intento ${i}/15):"
              curl -s http://localhost:8080/actuator/health | jq .
              exit 0
            fi
            # Si el contenedor ya termino, no tiene sentido seguir esperando.
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "El contenedor se detuvo antes de responder"
              break
            fi
            echo "Esperando a que la aplicacion arranque... (${i}/15)"
            sleep 2
          done

          echo "La aplicacion no respondio UP a tiempo"
          docker logs "$CONTAINER"
          exit 1

      - name: Detener el contenedor de prueba
        if: always()
        run: docker rm -f "$CONTAINER" || true
