# =====================================================================
# Configuracion base, comun a todos los perfiles.
# Lo especifico de cada ambiente vive en application-dev.properties y
# application-prod.properties. Sintaxis ${VARIABLE:valor-por-defecto}:
# si la variable de entorno existe se usa; si no, se usa el valor por defecto.
# =====================================================================
spring.application.name=pedidos

# Railway/Render inyectan PORT; en local se usa 8080.
server.port=${PORT:8080}

# Sin variable de entorno, la aplicacion arranca con el perfil dev.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

# springdoc-openapi / Swagger UI (sin cambios respecto a la Unidad 11)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.override-with-generic-response=false
