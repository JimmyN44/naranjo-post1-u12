# =====================================================================
# Perfil prod: se activa con SPRING_PROFILES_ACTIVE=prod.
# Base de datos externa PostgreSQL. Las credenciales NO tienen valor por
# defecto: si DATASOURCE_USER o DATASOURCE_PASSWORD no estan definidas,
# Spring Boot deja el texto literal del placeholder, la conexion a la base
# de datos es rechazada y la aplicacion no arranca (nunca usa una
# credencial por defecto).
# =====================================================================
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidosdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Nunca create-drop en produccion. Por defecto se valida el esquema existente.
# El proyecto no usa Flyway/Liquibase: para crear las tablas en una base
# nueva (primer despliegue) se puede arrancar una vez con JPA_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.com.tienda.pedidos=INFO

# Actuator: solo health e info; detalles de salud solo para usuarios autorizados.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
