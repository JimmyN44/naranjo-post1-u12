# =====================================================================
# Perfil dev: desarrollo local y pruebas del pipeline.
# Todos los valores tienen un default seguro, asi que arranca sin
# configurar ninguna variable de entorno (H2 en memoria).
# =====================================================================
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:pedidosdb}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# Base en memoria: el esquema se crea al arrancar y se descarta al detener.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2 (http://localhost:8080/h2-console), solo en desarrollo.
spring.h2.console.enabled=true

logging.level.com.tienda.pedidos=DEBUG

# Actuator: todos los endpoints expuestos, solo en desarrollo.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
